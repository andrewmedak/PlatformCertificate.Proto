name: .NET

on:
  push:

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
        matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore PlatformCertificate.Proto.sln
    - name: Build
      run: dotnet build PlatformCertificate.Proto.sln --no-restore
    - name: Test
      run: dotnet test PlatformCertificate.Proto.sln --no-build --verbosity normal
    - name: Proto files package
      run: |
        dotnet pack PlatformCertificate.Proto.ProtoFiles.csproj